[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# The old Netlify address sends everyone (and Google) to the real domain
[[redirects]]
  from = "https://iihec.netlify.app/*"
  to = "https://iihec.org/:splat"
  status = 301
  force = true

# Khmer pages that do not exist show the Khmer "page not found"
[[redirects]]
  from = "/km/*"
  to = "/km/404.html"
  status = 404

# Standard security settings for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
